# nginx server block for autoace.tdlv.dev
# Installed to /etc/nginx/sites-available/autoace.tdlv.dev and symlinked into
# sites-enabled. Plain HTTP only until certbot adds the TLS server block
# (certbot --nginx appends that automatically once DNS resolves).

server {
    listen 80;
    listen [::]:80;
    server_name autoace.tdlv.dev;

    # Let's Encrypt HTTP-01 challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # FastAPI inference/batch API
    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 500M;  # batch ZIP/folder uploads
        proxy_read_timeout 300s;    # batch processing can be slow
    }

    # Next.js dashboard
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
