# nginx server block for autoace.tdlv.dev
# Installed to /etc/nginx/sites-available/autoace.tdlv.dev and symlinked into
# sites-enabled. Plain HTTP only until certbot adds the TLS server block
# (certbot --nginx appends that automatically once DNS resolves).

server {
    server_name autoace.tdlv.dev;

    # Let's Encrypt HTTP-01 challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # FastAPI inference/batch API
    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 500M;  # batch ZIP/folder uploads
        proxy_read_timeout 300s;    # batch processing can be slow
    }

    # Next.js dashboard
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/autoace.tdlv.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/autoace.tdlv.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = autoace.tdlv.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name autoace.tdlv.dev;
    return 404; # managed by Certbot


}